[package]
name = "weldspeak-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WeldSpeak dictation client"

[lib]
name = "weldspeak_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
weldspeak-core = { path = "../../../packages/dictation-core" }
weldspeak-protocol = { path = "../../../packages/protocol-rs" }

tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

cpal = "0.15"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
arboard = "3"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
objc2 = { version = "0.5", features = ["exception"] }
objc2-app-kit = { version = "0.2", features = [
  "NSEvent",
  "NSApplication",
  "NSButton",
  "NSButtonCell",
  "NSControl",
  "NSFont",
  "NSColor",
  "NSPanel",
  "NSPopUpButton",
  "NSResponder",
  "NSScreen",
  "NSText",
  "NSTextField",
  "NSView",
  "NSWindow",
  "NSWorkspace",
  "NSRunningApplication",
  "NSGraphics",
  "block2",
] }
objc2-foundation = { version = "0.2", features = ["NSArray", "NSString", "NSGeometry", "NSObject"] }
block2 = "0.5"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Media_Control",
  "Foundation",
  "Foundation_Collections",
] }
