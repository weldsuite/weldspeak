# Releases everything from main at once: the API Worker (which also serves the
# web dashboard) and the desktop installers.
#
# Builds installable desktop apps. You do not need Rust or Visual Studio on
# your own machine: GitHub's Windows and macOS runners already have them.
#
# Run from the Actions tab (Run workflow) or push a tag like v0.1.0.
# The .exe / .dmg show up as workflow artifacts. Tags also get a GitHub Release.
# Pushes to main also deploy the Worker and refresh the rolling `desktop`
# release that the in-app updater reads. The updater feed waits for the
# Worker, so installed apps never update onto an API that lacks what they need.
#
# The Worker deploy needs the CLOUDFLARE_API_TOKEN repository secret: a
# Cloudflare API token with "Edit Cloudflare Workers" and "D1 Edit" on the
# WeldSuite account.

name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    # main is what installed copies run: every push ships an update.
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --bundles nsis
            artifact: target/release/bundle/nsis/*.exe
            updater: target/release/bundle/nsis/*.sig
          - name: macOS
            os: macos-latest
            # `app` is required for updater signatures; dmg is the downloadable installer.
            args: --bundles app,dmg
            artifact: target/release/bundle/dmg/*.dmg
            updater: |
              target/release/bundle/macos/*.tar.gz
              target/release/bundle/macos/*.sig
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      # Installed copies compare this against latest.json. Each successful
      # installer run must be a newer semver than 0.1.0.
      - name: Stamp a unique version
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const p = 'apps/desktop/src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            c.version = '0.1.' + process.env.GITHUB_RUN_NUMBER;
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
            console.log(c.version);
          "

      # Hub webview assets (Vite) + native pill/tray.
      - run: pnpm --filter @weldspeak/desktop-ui build
      # `exec` runs the CLI directly so `--bundles` is not swallowed by pnpm
      # or forwarded to cargo (which is what `tauri build -- --bundles` does).
      #
      # On macOS, Tauri signs with the Developer ID certificate in
      # APPLE_CERTIFICATE (imported into a throwaway keychain) and notarizes
      # and staples the .app when the App Store Connect API key is present.
      - name: Build installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        shell: bash
        run: |
          extra=()
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            extra+=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set; this build cannot produce auto-updates."
          fi

          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -z "$APPLE_CERTIFICATE" ]; then
              echo "::warning::APPLE_CERTIFICATE is not set; the macOS app is unsigned and Gatekeeper will block it."
            elif [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_ISSUER" ] || [ -z "$APPLE_API_KEY_P8" ]; then
              echo "::warning::App Store Connect API key secrets are incomplete; the macOS app is signed but not notarized."
            else
              key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
              printf '%s\n' "$APPLE_API_KEY_P8" > "$key_path"
              export APPLE_API_KEY_PATH="$key_path"
              echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
            fi
          fi

          pnpm --filter @weldspeak/desktop-ui exec tauri build ${{ matrix.args }} "${extra[@]}"

      # Tauri signs the .dmg but only notarizes the .app inside it. Notarizing
      # the .dmg as well lets Gatekeeper clear the download offline, before
      # the app is ever copied out of it.
      - name: Notarize disk image
        if: runner.os == 'macOS' && env.APPLE_API_KEY_PATH != ''
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for dmg in target/release/bundle/dmg/*.dmg; do
            xcrun notarytool submit "$dmg" --wait \
              --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER"
            xcrun stapler staple "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose "$dmg"
          done

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: WeldSpeak-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

      - name: Upload updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WeldSpeak-${{ matrix.name }}-updater
          path: ${{ matrix.updater }}
          if-no-files-found: warn

      - name: Attach to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          generate_release_notes: true

  api:
    name: API and dashboard
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: cfcf560df8dc675d15337abcfbf6d9bd
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check the Cloudflare token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret to deploy the API."
            exit 1
          fi

      # The Worker serves the dashboard from this build; .env.production
      # supplies the live Clerk publishable key.
      - run: pnpm --filter @weldspeak/web build

      # Schema first: new code may read columns the old schema lacks, while
      # migrations here are additive and safe under the running version.
      - name: Apply D1 migrations
        run: pnpm --filter @weldspeak/api exec wrangler d1 migrations apply weldspeak --remote

      - name: Deploy Worker
        run: pnpm --filter @weldspeak/api exec wrangler deploy --message "main ${GITHUB_SHA::7}"

  publish:
    name: Rolling updater release
    needs: [bundle, api]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/publish-desktop-update.mjs artifacts
