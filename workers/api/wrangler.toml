name = "weldspeak-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
# The dashboard and API share one hostname, so the device-approval link the
# desktop app opens is same-origin with the API it then talks to.
# Keep the workers.dev hostname alive alongside the custom domain: it is the
# fallback that still answers if the domain is mid-migration or a cert is
# still provisioning.
workers_dev = true

routes = [
  { pattern = "weldspeak.weldsuite.org", custom_domain = true },
  # weldspeak.com is the Vercel marketing site; never claim it here.
  { pattern = "api.weldspeak.com", custom_domain = true }
]


# The web dashboard is served from the same Worker as the API. One deployment
# target, and the browser talks to the API same-origin, so there is no CORS
# preflight on the device-approval path.
[assets]
directory = "../../apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "weldspeak"
database_id = "cd71fa9a-9b44-4998-83a5-9707b7aca63c"
migrations_dir = "migrations"

# Pending device authorizations. KV rather than D1 because these are
# write-once, read-a-few-times, and expire on their own after ten minutes.
[[kv_namespaces]]
binding = "DEVICE_CODES"
id = "f5985d2fcf664fd38c5c000189d2f18c"

[[durable_objects.bindings]]
name = "DICTATION"
class_name = "DictationSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DictationSession"]

[vars]
APP_URL = "https://weldspeak.weldsuite.org"
# Cleanup runs Gemma 4 26B through OpenRouter, routed to the fastest provider:
# a median 200 ms against 860 ms for the same model on Workers AI (see
# scripts/bench-cleanup.ts). If OpenRouter fails, the Workers AI copy answers.
# An "@cf/..." name here runs on Workers AI only.
CLEANUP_MODEL = "google/gemma-4-26b-a4b-it"
# Speech-to-text. MAI-Transcribe 2 through OpenRouter (batch, sent on release;
# see src/stt.ts): 60 languages with detection and code switching, and keyword
# biasing in every language. Needs the OPENROUTER_API_KEY secret; without it,
# or when it fails, a dictation falls back to batch Nova-3 on Workers AI.
# To roll back to streaming Nova-3, set this to "@cf/deepgram/nova-3".
STT_MODEL = "microsoft/mai-transcribe-2"
# Publishable: same Clerk application as WeldSuite. Encodes clerk.weldsuite.org.
CLERK_PUBLISHABLE_KEY = "pk_live_Y2xlcmsud2VsZHN1aXRlLm9yZyQ"

# Secrets — set with `wrangler secret put <NAME>`, never committed:
#   CLERK_SECRET_KEY        WeldSuite Clerk secret (sk_live_...)
#   CLERK_WEBHOOK_SECRET    Svix signing secret for the Clerk webhook
#   TOKEN_SIGNING_KEY       Random 32+ byte secret used to sign WeldSpeak access tokens
#   OPENROUTER_API_KEY      OpenRouter key for MAI-Transcribe (sk-or-...)

# Keeps the per-dictation "dictation timings" log lines queryable in the
# dashboard, so latency can be reviewed stage by stage after the fact.
[observability]
enabled = true
